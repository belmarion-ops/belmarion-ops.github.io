<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>BELMARION</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#000;color:#ededed}
    body{min-height:100vh;display:grid;place-items:center;padding:28px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    main{text-align:center;max-width:34rem}
    .brand{font-size:1.05rem;letter-spacing:.32em;margin:0 0 2.25rem}
    .title{font-size:.9rem;letter-spacing:.20em;margin:0 0 1rem}
    .line{font-size:.72rem;letter-spacing:.12em;color:#707070;line-height:1.8;margin:0}
  </style>
</head>
<body>
  <main>
    <p class="brand">BELMARION</p>
    <div id="cipher" hidden>
      <p class="title">CIPHER PRESENT.</p>
      <p class="line">Open this Cipher on a device with Belmarion installed.</p>
    </div>
    <div id="closed">
      <p class="title">CLOSED.</p>
      <p class="line">A current Cipher is required.</p>
    </div>
  </main>
  <script>
    if (location.pathname.startsWith('/cipher/')) {
      document.getElementById('cipher').hidden = false;
      document.getElementById('closed').hidden = true;
    }
  </script>
</body>
</html>
